name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12.3"
  PYTHON_BUILD_DATE: "20240415"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Disable code signing
        run: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r flutter_download_manager.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: flutter_download_manager.ipa

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build clang cmake pkg-config
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build Linux
        run: flutter build linux --release
      - name: Download Python runtime (Linux x86_64)
        run: |
          mkdir -p python_runtime/linux
          cd /tmp
          curl -L --progress-bar -o python.tar.gz \
            "https://github.com/indygreg/python-build-standalone/releases/download/${{ env.PYTHON_BUILD_DATE }}/cpython-${{ env.PYTHON_VERSION }}+${{ env.PYTHON_BUILD_DATE }}-x86_64-unknown-linux-gnu-install_only.tar.gz"
          tar xzf python.tar.gz -C "$GITHUB_WORKSPACE/python_runtime/linux" --strip-components=1
          rm python.tar.gz
          chmod +x "$GITHUB_WORKSPACE/python_runtime/linux/bin/python3"
      - name: Install Python dependencies
        run: |
          "$GITHUB_WORKSPACE/python_runtime/linux/bin/python3" -m pip install httpx pyyaml gmssl --quiet
      - name: Bundle Python runtime into release
        run: |
          cp -r python_runtime build/linux/x64/release/bundle/
          cp assets/python/*.py build/linux/x64/release/bundle/python_runtime/
      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release
          tar czf ../../../flutter_download_manager-linux-x86_64.tar.gz bundle/
      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/flutter_download_manager-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build Windows
        run: flutter build windows --release
      - name: Download Python runtime (Windows x86_64)
        run: |
          mkdir -p python_runtime/windows
          cd $env:TEMP
          curl -L --progress-bar -o python.tar.gz "https://github.com/indygreg/python-build-standalone/releases/download/${{ env.PYTHON_BUILD_DATE }}/cpython-${{ env.PYTHON_VERSION }}+${{ env.PYTHON_BUILD_DATE }}-x86_64-pc-windows-msvc-shared-install_only.tar.gz"
          tar xzf python.tar.gz -C "$env:GITHUB_WORKSPACE\python_runtime\windows" --strip-components=1
          Remove-Item python.tar.gz
        shell: pwsh
      - name: Install Python dependencies
        run: |
          & "$env:GITHUB_WORKSPACE\python_runtime\windows\python.exe" -m pip install httpx pyyaml gmssl --quiet
        shell: pwsh
      - name: Bundle Python runtime into release
        run: |
          xcopy /E /I /Y python_runtime build\windows\x64\runner\Release\python_runtime
          copy /Y assets\python\*.py build\windows\x64\runner\Release\python_runtime\
        shell: cmd
      - name: Package Windows bundle
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "flutter_download_manager-windows-x86_64.zip"
        shell: pwsh
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: flutter_download_manager-windows-x86_64.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build macOS
        run: flutter build macos --release
      - name: Download Python runtime (macOS ARM64)
        run: |
          mkdir -p python_runtime/macos
          cd /tmp
          curl -L --progress-bar -o python.tar.gz \
            "https://github.com/indygreg/python-build-standalone/releases/download/${{ env.PYTHON_BUILD_DATE }}/cpython-${{ env.PYTHON_VERSION }}+${{ env.PYTHON_BUILD_DATE }}-aarch64-apple-darwin-install_only.tar.gz"
          tar xzf python.tar.gz -C "$GITHUB_WORKSPACE/python_runtime/macos" --strip-components=1
          rm python.tar.gz
      - name: Install Python dependencies
        run: |
          "$GITHUB_WORKSPACE/python_runtime/macos/bin/python3" -m pip install httpx pyyaml gmssl --quiet
      - name: Bundle Python runtime into app
        run: |
          APP_PATH="build/macos/Build/Products/Release/flutter_download_manager.app"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR/python_runtime"
          cp -r python_runtime/* "$FRAMEWORKS_DIR/python_runtime/"
          cp assets/python/*.py "$FRAMEWORKS_DIR/python_runtime/"
      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../flutter_download_manager-mac.zip flutter_download_manager.app
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: flutter_download_manager-mac.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la artifacts/
          for d in artifacts/*/; do
            echo "--- $d ---"
            ls -la "$d"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/ios-ipa/flutter_download_manager.ipa
            artifacts/linux-bundle/*.tar.gz
            artifacts/windows-bundle/*.zip
            artifacts/macos-app/*.zip
          body: |
            ## 下载

            | 平台 | 文件 |
            |---|---|
            | **Android** | `app-release.apk` |
            | **iOS** | `flutter_download_manager.ipa` (未签名) |
            | **Linux** | `flutter_download_manager-linux-x86_64.tar.gz` (含内嵌Python) |
            | **Windows** | `flutter_download_manager-windows-x86_64.zip` (含内嵌Python) |
            | **macOS** | `flutter_download_manager-mac.zip` (含内嵌Python) |

            ## 安装说明

            **Android**: 直接安装 APK

            **iOS**: 需要签名后安装（用 Xcode 或 Sideloadly）

            **Linux**: `tar xzf flutter_download_manager-linux-x86_64.tar.gz && cd bundle && ./flutter_download_manager`

            **Windows**: 解压后运行 `flutter_download_manager.exe`

            **macOS**: 解压后拖入 Applications 文件夹

            ## 内嵌 Python

            所有桌面版 (Linux/Windows/macOS) 均内置 Python 3.12 运行时，无需额外安装 Python。
